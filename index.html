<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="두두타 잡초 타이머">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f2d0a">
<title>두두타 잡초 타이머</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
:root{
  --green-900:#0a1e07;--green-800:#0f2d0a;--green-700:#1a4d14;
  --green-600:#2d5a27;--green-500:#3d7a35;--green-400:#4e9a42;
  --green-300:#6ab85d;--green-200:#8ed080;--green-100:#b8e4b0;
  --green-50:#e0f5dc;
  --amber-800:#5c3008;--amber-700:#7a4a0a;--amber-600:#a06414;
  --amber-500:#c47f1e;--amber-400:#e09d30;--amber-300:#f0be60;
  --amber-200:#f5d898;--amber-100:#fdf0cc;--amber-50:#fffaea;
  --bg:#0a1e07;--surface:#0f2d0a;--surface2:#1a4d14;--surface3:#2d5a27;
  --border:#2d5a27;--border2:#3d7a35;
  --text:#e0f5dc;--text-muted:#8ed080;--text-dim:#4e9a42;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;background:var(--bg);}
body{
  height:100%;min-height:100vh;min-height:-webkit-fill-available;
  display:flex;flex-direction:column;
  background:var(--bg);color:var(--text);
  font-family:'Nanum Gothic',sans-serif;
  overflow:hidden;
  max-width:480px;margin:0 auto;
  position:relative;
}

/* TOPBAR */
.topbar{
  background:var(--surface);
  padding:calc(14px + var(--safe-top)) 16px 12px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.topbar-title{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-0.3px;}
.topbar-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
.notif-btn{
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:20px;padding:8px 14px;
  color:var(--text-muted);font-size:12px;font-weight:700;
  cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.notif-btn.granted{background:var(--green-500);border-color:var(--green-300);color:#fff;}

/* MAIN */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px;}
.main::-webkit-scrollbar{display:none;}

.sec{font-size:11px;font-weight:800;color:var(--text-dim);letter-spacing:0.1em;text-transform:uppercase;margin:16px 0 10px 2px;}

/* CROP GRID */
.crop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:18px;}
.crop-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:14px;padding:13px 11px 11px;
  cursor:pointer;transition:all 0.15s;
  position:relative;overflow:hidden;user-select:none;
}
.crop-card.sel{border-color:var(--green-300);background:var(--surface2);box-shadow:0 0 0 2px var(--green-400);}
.crop-card.season{border-color:var(--amber-600);}
.crop-emoji{font-size:30px;line-height:1;display:block;margin-bottom:6px;}
.crop-name{font-size:13px;font-weight:800;color:var(--text);margin-bottom:2px;}
.crop-dur{font-size:11px;color:var(--text-muted);}

/* FORM BOX */
.form-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.form-label{display:block;font-size:11px;font-weight:800;color:var(--text-dim);letter-spacing:0.06em;margin-bottom:7px;}
.form-input{
  width:100%;background:var(--bg);border:1px solid var(--border2);
  border-radius:8px;padding:12px 13px;
  color:var(--text);font-size:14px;font-family:'Nanum Gothic',sans-serif;
  outline:none;
}

/* TOGGLE */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.toggle-row:last-child{border-bottom:none;}
.toggle-info .tl-main{font-size:13px;color:var(--text);font-weight:700;}
.toggle{width:48px;height:26px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:13px;position:relative;cursor:pointer;transition:all 0.25s;}
.toggle.on{background:var(--green-400);border-color:var(--green-300);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;background:#fff;border-radius:50%;transition:transform 0.25s;}
.toggle.on::after{transform:translateX(22px);}

.btn-plant{
  width:100%;background:var(--green-500);border:none;border-radius:14px;
  padding:17px;color:#fff;font-size:16px;font-weight:800;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
}

/* HELP PAGE */
.help-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;line-height:1.6;}
.h-title{font-size:15px;font-weight:800;color:var(--amber-300);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.h-content{font-size:13px;color:var(--text-muted);}
.h-tip{background:var(--bg);border-radius:10px;padding:12px;margin-top:10px;font-size:12px;color:var(--text-dim);border-left:3px solid var(--amber-500);}
.h-tag{display:inline-block;background:var(--surface3);color:var(--green-100);font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;margin-right:4px;}

/* TIMER CARDS */
.timer-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:11px;}
.timer-card.harvest-glow{border-color:var(--amber-500);animation:hglow 2.5s infinite;}
@keyframes hglow{0%,100%{box-shadow:0 0 8px rgba(196,127,30,0.15)}50%{box-shadow:0 0 20px rgba(196,127,30,0.4)}}
.th{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.th-emoji{font-size:24px;}
.th-info{flex:1;}
.th-name{font-size:14px;font-weight:800;}
.th-del{background:transparent;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;}
.prog-bar{height:4px;background:var(--bg);border-radius:2px;margin-top:10px;overflow:hidden;}
.prog-fill{height:100%;background:var(--green-400);transition:width 1s linear;}

/* NAV */
.nav{display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:var(--safe-bottom);flex-shrink:0;}
.nav-tab{flex:1;padding:11px 8px 9px;text-align:center;cursor:pointer;border:none;background:transparent;}
.nav-tab.on .nav-lbl{color:var(--green-200);}
.nav-ico{font-size:22px;display:block;}
.nav-lbl{font-size:10px;color:var(--text-dim);font-weight:700;}
.nav-bdg{display:none;background:var(--amber-500);color:#fff;font-size:9px;border-radius:10px;padding:1px 5px;}
.nav-bdg.show{display:inline-block;}

/* TOAST */
.toast-wrap{position:fixed;top:0;left:50%;transform:translateX(-50%);width:92%;max-width:440px;z-index:9999;pointer-events:none;padding-top:calc(80px + var(--safe-top));}
.toast{background:var(--surface2);border:1px solid var(--green-400);border-radius:12px;padding:12px 16px;margin-bottom:8px;color:var(--text);font-size:13px;font-weight:700;text-align:center;animation:tin 0.3s ease;}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.toast.weed{background:var(--amber-800);border-color:var(--amber-400);}
.toast.harvest{background:var(--green-600);border-color:var(--green-200);}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">🌻 두두타 잡초 타이머</div>
    <div class="topbar-sub">비료 1번 + 잡초 4번 = ⭐⭐⭐⭐⭐</div>
  </div>
  <button class="notif-btn" id="notifBtn" onclick="reqNotif()">🔔 알림허용</button>
</div>

<div class="toast-wrap" id="toasts"></div>
<div class="main" id="main"></div>

<nav class="nav">
  <button class="nav-tab on" onclick="goTab('add')" id="nt-add"><span class="nav-ico">🌱</span><span class="nav-lbl">심기</span></button>
  <button class="nav-tab" onclick="goTab('timers')" id="nt-timers"><span class="nav-ico">⏱️</span><span class="nav-lbl">타이머 <span class="nav-bdg" id="bdg">0</span></span></button>
  <button class="nav-tab" onclick="goTab('help')" id="nt-help"><span class="nav-ico">❓</span><span class="nav-lbl">도움말</span></button>
</nav>

<script>
const CROPS=[
  {id:'lemon',e:'🌿',n:'레몬 버베나',m:15,season:true},
  {id:'tomato',e:'🍅',n:'토마토',m:15},
  {id:'pineapple',e:'🍍',n:'파인애플',m:30},
  {id:'potato',e:'🥔',n:'감자',m:60},
  {id:'carrot',e:'🥕',n:'당근',m:120},
  {id:'wheat',e:'🌾',n:'밀',m:240},
  {id:'strawberry',e:'🍓',n:'딸기',m:360},
  {id:'eggplant',e:'🍆',n:'가지',m:420},
  {id:'lettuce',e:'🥬',n:'양상추',m:480},
  {id:'grape',e:'🍇',n:'포도',m:600},
  {id:'corn',e:'🌽',n:'옥수수',m:720}
];

let timers=[];
let sel=null;
let tab='add';
let globalNotifWeed = true;
let globalNotifHarvest = true;
let alarms={};
let swReg=null;
let notifEnabled=localStorage.getItem('dkdk_notif')!=='off';

function loadTimers(){
  const d=localStorage.getItem('dkdk5_timers');
  if(d) timers=JSON.parse(d);
  const now=Date.now();
  timers=timers.filter(t=>now < t.times.w4+7200000);
}
function saveTimers(){ localStorage.setItem('dkdk5_timers',JSON.stringify(timers)); }

function calcTimes(planted,mins){
  const tot=mins*60000;
  return{
    w1:planted+tot/3, w2:planted+tot*2/3, w3:planted+tot-60000,
    mature:planted+tot, w4:planted+tot+60000
  };
}

function toast(msg,type=''){
  const w=document.getElementById('toasts');
  const d=document.createElement('div');
  d.className='toast '+(type||'');
  d.textContent=msg;
  w.appendChild(d);
  setTimeout(()=>{d.remove();},4000);
}

function reqNotif(){
  Notification.requestPermission().then(p=>{
    notifEnabled=(p==='granted');
    localStorage.setItem('dkdk_notif',notifEnabled?'on':'off');
    updNBtn();
  });
}
function updNBtn(){
  const b=document.getElementById('notifBtn');
  b.textContent = (Notification.permission==='granted'&&notifEnabled)?'🔔 알림 ON':'🔕 알림 OFF';
}

function schedAlarms(){
  Object.values(alarms).forEach(clearTimeout);
  timers.forEach(t=>{
    ['w1','w2','w3','w4','mature'].forEach(s=>{
      const ms=t.times[s]-Date.now();
      if(ms>0 && !t.done.includes(s)){
        alarms[t.id+'_'+s]=setTimeout(()=>{
          t.done.push(s); saveTimers();
          if(s==='mature'){
            if(t.notifHarvest) toast(`🎉 ${t.n} 성숙 완료!`, 'harvest');
          } else {
            if(t.notifWeed) toast(`🌿 ${t.n} 잡초!`, 'weed');
          }
          if(tab==='timers') renderTimers();
        },ms);
      }
    });
  });
}

function addTimer(){
  if(!sel) return;
  const crop=CROPS.find(c=>c.id===sel);
  const label=document.getElementById('lbl').value||'';
  const id=Date.now()+'_'+Math.random().toString(36).substr(2,5);
  timers.push({
    id, n:crop.n, e:crop.e, label:label.trim(),
    planted:Date.now(), times:calcTimes(Date.now(), crop.m),
    notifWeed: globalNotifWeed, notifHarvest: globalNotifHarvest,
    done:[]
  });
  saveTimers(); schedAlarms(); sendAlarmsToSW();
  toast(`🌱 ${crop.n} 시작!`);
  goTab('timers');
}

function goTab(t){
  tab=t;
  document.getElementById('nt-add').className='nav-tab'+(t==='add'?' on':'');
  document.getElementById('nt-timers').className='nav-tab'+(t==='timers'?' on':'');
  document.getElementById('nt-help').className='nav-tab'+(t==='help'?' on':'');
  if(t==='add') renderAdd(); else if(t==='timers') renderTimers(); else renderHelp();
}

function pickCrop(id){ sel=id; renderAdd(); }
function togWeed(){ globalNotifWeed=!globalNotifWeed; renderAdd(); }
function togHarvest(){ globalNotifHarvest=!globalNotifHarvest; renderAdd(); }

function renderAdd(){
  const m=document.getElementById('main');
  m.innerHTML=`
    <p class="sec">🌿 작물 선택</p>
    <div class="crop-grid">${CROPS.map(c=>`
      <div class="crop-card ${c.id===sel?'sel':''} ${c.season?'season':''}" onclick="pickCrop('${c.id}')">
        <span class="crop-emoji">${c.e}</span>
        <div class="crop-name">${c.n}</div>
        <div class="crop-dur">${c.m}분</div>
      </div>`).join('')}</div>
    <div class="form-box">
      <p class="sec" style="margin-top:0">⚙️ 알림 설정</p>
      <div class="toggle-row">
        <div class="toggle-info"><div class="tl-main">🌿 잡초 알림</div></div>
        <div class="toggle ${globalNotifWeed?'on':''}" onclick="togWeed()"></div>
      </div>
      <div class="toggle-row">
        <div class="toggle-info"><div class="tl-main">✨ 성숙 완료 알림</div></div>
        <div class="toggle ${globalNotifHarvest?'on':''}" onclick="togHarvest()"></div>
      </div>
      <div style="height:15px"></div>
      <label class="form-label">🏷️ 라벨</label>
      <input class="form-input" id="lbl" type="text" placeholder="예: 1번 밭" maxlength="10">
    </div>
    <button class="btn-plant" onclick="addTimer()">🌱 타이머 시작</button>
  `;
}

function renderTimers(){
  const m=document.getElementById('main');
  const b=document.getElementById('bdg');
  b.textContent=timers.length; b.className='nav-bdg '+(timers.length?'show':'');
  if(!timers.length){ m.innerHTML='<div class="empty">진행 중인 타이머가 없어요.</div>'; return; }
  m.innerHTML=timers.map(t=>{
    const now=Date.now();
    const pct=Math.min(100, ((now-t.planted)/(t.times.mature-t.planted))*100);
    return `<div class="timer-card ${now>t.times.mature?'harvest-glow':''}">
      <div class="th">
        <span class="th-emoji">${t.e}</span>
        <div class="th-info"><div class="th-name">${t.n} <small>${t.label}</small></div></div>
        <button class="th-del" onclick="delTimer('${t.id}')">✕</button>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function renderHelp(){
  document.getElementById('main').innerHTML=`
    <div class="help-card">
      <div class="h-title">⭐ 5성 작물 조건</div>
      <div class="h-content">
        두근두근타운에서 작물 5성 확률을 높이려면<br>
        <strong>비료 1번 + 잡초 4번 제거</strong>가 필요해요.
      </div>
      
      <div style="height:15px"></div>
      
      <div class="h-title">🌱 잡초 시점 (W1 ~ W4)</div>
      <div class="h-content">
        <span class="h-tag">W1</span> 자라는 시간의 1/3 지점<br>
        <span class="h-tag">W2</span> 자라는 시간의 2/3 지점<br>
        <span class="h-tag">W3</span> 성숙 약 1분 전<br>
        <span class="h-tag">W4</span> 성숙 약 1분 후
      </div>

      <div class="h-tip">
        <strong>💡 마지막 잡초(W4) 제거 팁</strong><br>
        마지막 잡초는 성숙 이후 자라기 때문에, 본인 계정으로 제거 시 작물이 같이 수확됩니다.<br>
        친구 계정 혹은 부계정을 이용하거나, 가방을 꽉 채운 뒤 잡초를 먼저 제거해보세요.
      </div>
    </div>

    <div class="help-card">
      <div class="h-title">🔔 알림 설정</div>
      <div class="h-content">
        브라우저 알림으로 잡초 시점을 알려드려요.<br>
        첫 작물을 심을 때 권한을 허용해주세요.<br>
        <small style="color:var(--text-dim)">* 탭을 닫으면 알림이 멈추니 켜둔 채로 두세요.</small>
      </div>
    </div>
  `;
}

function delTimer(id){ timers=timers.filter(t=>t.id!==id); saveTimers(); renderTimers(); }

async function registerSW(){
  if('serviceWorker' in navigator) swReg=await navigator.serviceWorker.register('sw.js');
}

function sendAlarmsToSW(){
  if(!swReg||!swReg.active||!notifEnabled) return;
  const alarmList=[];
  timers.forEach(t=>{
    ['w1','w2','w3','w4','mature'].forEach(s=>{
      if(t.times[s]>Date.now() && !t.done.includes(s)){
        if((s==='mature' && t.notifHarvest) || (s!=='mature' && t.notifWeed)){
          alarmList.push({
            id:t.id+'_'+s, time:t.times[s], 
            title:s==='mature'?'🎉 성숙 완료!':`🌿 잡초 발생!`,
            body:t.n + (t.label?' ('+t.label+')':'')
          });
        }
      }
    });
  });
  swReg.active.postMessage({type:'SCHEDULE_ALARMS', alarms:alarmList});
}

loadTimers();
registerSW().then(updNBtn);
renderAdd();
setInterval(()=>{ if(tab==='timers') renderTimers(); }, 5000);
</script>
</body>
</html>
